name: OrangeHRM Automation Pipeline

# Trigger the workflow on pushes or pull requests to the master/main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Tells GitHub Actions to run all commands inside your project subfolder
    defaults:
      run:
        working-directory: ./orangehrm-automation-framework

    steps:
    # 1. Check out repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python version
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest selenium webdriver-manager allure-pytest

    # 4. Run Pytest tests
    - name: Run Pytest tests
      run: |
        pytest -v